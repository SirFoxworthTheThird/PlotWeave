<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900">
  <!-- The Kansas prairie. Feature positions match the world's location markers. -->
  <defs>
    <filter id="wobble">
      <feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8d979d"/><stop offset="70%" stop-color="#b3b2a6"/>
      <stop offset="100%" stop-color="#c8c3b1"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9c1a3"/><stop offset="100%" stop-color="#b4a985"/>
    </linearGradient>
    <pattern id="stubble" width="46" height="26" patternUnits="userSpaceOnUse">
      <path d="M6 22 l4 -9 M20 24 l3 -10 M33 20 l4 -8 M42 25 l3 -9"
            stroke="#9c9070" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M13 14 q4 -6 8 0" stroke="#9c9070" stroke-width="1.4" fill="none" opacity=".6"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="52%" r="72%">
      <stop offset="62%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3f3520" stop-opacity=".24"/>
    </radialGradient>

    <symbol id="grasstuft" viewBox="0 0 30 18" overflow="visible">
      <path d="M4 17 q4 -14 7 -1 M12 17 q4 -16 8 -1 M21 17 q4 -13 6 -1"
            fill="none" stroke="#8d8464" stroke-width="1.9" stroke-linecap="round"/>
    </symbol>
    <symbol id="cow" viewBox="0 0 62 40" overflow="visible">
      <path d="M8 14 C4 8 12 6 18 9 L46 9 C56 9 58 18 56 24 L54 32 L48 32 L47 24 L22 24 L21 32 L15 32 L14 22 Z"
            fill="#7c705c" stroke="#4a4032" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="12" cy="12" r="2" fill="#3b3225"/>
      <path d="M56 24 q6 4 4 10" fill="none" stroke="#4a4032" stroke-width="2"/>
    </symbol>
  </defs>

  <!-- sky, horizon, ground -->
  <rect width="1300" height="900" fill="url(#sky)"/>
  <rect y="300" width="1300" height="600" fill="url(#ground)"/>
  <rect y="300" width="1300" height="600" fill="url(#stubble)"/>
  <path d="M0 302 H1300" stroke="#8b8168" stroke-width="3.5" filter="url(#wobble)"/>
  <g stroke="#a89e80" stroke-width="1.6" opacity=".55" fill="none">
    <path d="M0 340 H1300 M0 386 H1300 M0 448 H1300"/>
  </g>

  <!-- the cyclone coming out of the north -->
  <g filter="url(#wobble)" transform="translate(470,0)">
    <path d="M236 34 C316 30 336 66 312 108 C292 144 268 200 254 258 C248 288 242 298 236 302
             C230 298 224 288 218 258 C204 200 180 144 160 108 C136 66 156 30 236 34 Z"
          fill="#7d858b" fill-opacity=".72"/>
    <path d="M236 34 C316 30 336 66 312 108 C292 144 268 200 254 258 C248 288 242 298 236 302"
          fill="none" stroke="#5f676d" stroke-width="2.4" stroke-opacity=".8"/>
    <g fill="none" stroke="#f0efe6" stroke-width="2.2" stroke-opacity=".55">
      <path d="M182 78 q54 -18 108 4 M192 130 q46 -16 92 4 M204 186 q36 -13 70 4 M214 236 q26 -10 48 3"/>
    </g>
    <ellipse cx="236" cy="36" rx="92" ry="22" fill="#6f777d" fill-opacity=".8"/>
    <g fill="#8d8464" opacity=".55">
      <ellipse cx="236" cy="308" rx="70" ry="10"/>
    </g>
  </g>
  <text class="t" x="706" y="344" text-anchor="middle" font-family="Georgia,serif" font-size="20"
        fill="#4a4433" font-style="italic">the cyclone, out of the north</text>

  <!-- the fence line -->
  <g stroke="#8a7f62" stroke-width="4.5" fill="none" filter="url(#wobble)">
    <path d="M60 648 H1240"/>
    <path d="M60 648 V596 M212 650 V600 M364 648 V598 M516 650 V600 M668 648 V598
             M820 650 V600 M972 648 V598 M1124 650 V600 M1240 648 V600"/>
    <path d="M60 616 H1240" stroke-width="2" stroke-opacity=".7"/>
  </g>

  <!-- The Gale Farmhouse, at 430,500 -->
  <g transform="translate(430,500)">
    <ellipse cx="4" cy="62" rx="104" ry="14" fill="#8d8464" opacity=".35"/>
    <path d="M-96 -6 L0 -76 L96 -6 Z" fill="#8b6f52" stroke="#453221" stroke-width="3.4" stroke-linejoin="round"/>
    <g stroke="#6d5238" stroke-width="1.6" opacity=".8">
      <path d="M-72 -6 L-24 -41 M-40 -6 L8 -41 M-8 -6 L40 -41 M24 -6 L72 -41"/>
    </g>
    <rect x="-74" y="-6" width="148" height="64" fill="#cfc3a5" stroke="#453221" stroke-width="3.4"/>
    <g stroke="#a99c7e" stroke-width="1.4"><path d="M-74 10 H74 M-74 26 H74 M-74 42 H74"/></g>
    <rect x="-16" y="20" width="34" height="38" fill="#6b4a2c" stroke="#453221" stroke-width="2.6"/>
    <rect x="-58" y="6" width="26" height="24" fill="#e7e2d0" stroke="#453221" stroke-width="2.6"/>
    <rect x="34" y="6" width="26" height="24" fill="#e7e2d0" stroke="#453221" stroke-width="2.6"/>
    <path d="M-58 18 h26 M-45 6 v24 M34 18 h26 M47 6 v24" stroke="#453221" stroke-width="1.6"/>
    <path d="M42 -50 v-22 h16 v32" fill="#8b6f52" stroke="#453221" stroke-width="2.8"/>
  </g>

  <!-- The Cyclone Cellar, at 614,556 -->
  <g transform="translate(614,556)">
    <path d="M-46 16 L-30 -14 L34 -14 L50 16 Z" fill="#a08b68" stroke="#453221" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-30 -14 L-14 -30 L50 -30 L34 -14 Z" fill="#c0ae8b" stroke="#453221" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-24 6 H30 M-18 -4 H36" stroke="#6d5238" stroke-width="2.4"/>
    <path d="M40 -30 l10 -8" stroke="#453221" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- The Barnyard and Sheds, at 880,500 -->
  <g transform="translate(880,500)">
    <ellipse cx="0" cy="66" rx="120" ry="15" fill="#8d8464" opacity=".35"/>
    <path d="M-116 -12 L0 -80 L116 -12 Z" fill="#7d6248" stroke="#453221" stroke-width="3.4" stroke-linejoin="round"/>
    <rect x="-100" y="-12" width="200" height="74" fill="#9c8a6c" stroke="#453221" stroke-width="3.4"/>
    <g stroke="#7a6a4f" stroke-width="1.8"><path d="M-100 6 H100 M-100 26 H100 M-100 46 H100"/></g>
    <path d="M-34 62 v-46 h68 v46" fill="#5d4a34" stroke="#453221" stroke-width="3"/>
    <path d="M-34 40 h68" stroke="#453221" stroke-width="2.2"/>
    <path d="M0 -80 v-16" stroke="#453221" stroke-width="3"/>
    <path d="M0 -96 l16 6 l-16 6 z" fill="#6b5a3c" stroke="#453221" stroke-width="2"/>
  </g>
  <use href="#cow" x="1006" y="556" width="62" height="40"/>
  <use href="#cow" x="1078" y="586" width="54" height="35"/>

  <!-- The New Farmhouse, at 430,790 -->
  <g transform="translate(430,790)">
    <ellipse cx="4" cy="56" rx="92" ry="13" fill="#8d8464" opacity=".35"/>
    <path d="M-84 -4 L0 -66 L84 -4 Z" fill="#9b7c5b" stroke="#453221" stroke-width="3.2" stroke-linejoin="round"/>
    <g stroke="#7a5e42" stroke-width="1.5" opacity=".8"><path d="M-62 -4 L-20 -36 M-32 -4 L10 -36 M-2 -4 L40 -36"/></g>
    <rect x="-64" y="-4" width="128" height="56" fill="#ded3b7" stroke="#453221" stroke-width="3.2"/>
    <g stroke="#b6aa8c" stroke-width="1.3"><path d="M-64 10 H64 M-64 26 H64"/></g>
    <rect x="-14" y="18" width="30" height="34" fill="#6b4a2c" stroke="#453221" stroke-width="2.4"/>
    <rect x="-50" y="6" width="24" height="22" fill="#efeada" stroke="#453221" stroke-width="2.4"/>
    <rect x="28" y="6" width="24" height="22" fill="#efeada" stroke="#453221" stroke-width="2.4"/>
    <path d="M36 -44 v-18 h14 v26" fill="#9b7c5b" stroke="#453221" stroke-width="2.6"/>
  </g>

  <!-- the open prairie, at 1046,740 -->
  <g opacity=".9">
    <use href="#grasstuft" x="940" y="706" width="34" height="20"/>
    <use href="#grasstuft" x="1004" y="726" width="38" height="22"/>
    <use href="#grasstuft" x="1076" y="712" width="32" height="19"/>
    <use href="#grasstuft" x="1140" y="742" width="36" height="21"/>
    <use href="#grasstuft" x="980" y="768" width="30" height="18"/>
    <use href="#grasstuft" x="1060" y="782" width="34" height="20"/>
  </g>
  <path d="M520 706 C640 724 760 728 880 712" fill="none" stroke="#8a8168"
        stroke-width="5" stroke-linecap="round" stroke-dasharray="14 12" filter="url(#wobble)"/>

  <g font-family="Georgia,'Times New Roman',serif" fill="#33302a"
     style="paint-order:stroke;stroke:#d9d2ba;stroke-width:5;stroke-linejoin:round" font-size="21">
    <text x="430" y="600" text-anchor="middle">The Gale Farmhouse</text>
    <text x="614" y="612" text-anchor="middle">The Cyclone Cellar</text>
    <text x="880" y="608" text-anchor="middle">The Barnyard and Sheds</text>
    <text x="1046" y="838" text-anchor="middle">The Open Prairie</text>
    <text x="330" y="798" text-anchor="end">The New Farmhouse</text>
  </g>
  <text x="1046" y="864" text-anchor="middle" font-family="Georgia,serif" font-size="16"
        font-style="italic" fill="#55503f">gray to the edge of the sky, in every direction</text>

  <rect width="1300" height="900" fill="url(#vignette)"/>
  <g transform="translate(44,36)">
    <rect x="0" y="0" width="512" height="96" rx="6" fill="#efe9d5" fill-opacity=".8" stroke="#5a4f36" stroke-width="3"/>
    <rect x="8" y="8" width="496" height="80" rx="4" fill="none" stroke="#5a4f36" stroke-width="1.3" stroke-opacity=".6"/>
    <text x="24" y="52" font-family="Georgia,serif" font-size="42" font-weight="bold" fill="#33302a">The Kansas Prairie</text>
    <text x="24" y="78" font-family="Georgia,serif" font-size="16" font-style="italic" fill="#55503f">The farm the cyclone empties, and the one Uncle Henry builds in its place</text>
  </g>
  <rect x="16" y="16" width="1268" height="868" rx="6" fill="none" stroke="#5a4f36" stroke-width="4"/>
  <rect x="27" y="27" width="1246" height="846" rx="4" fill="none" stroke="#5a4f36" stroke-width="1.5" stroke-opacity=".6"/>
</svg>
