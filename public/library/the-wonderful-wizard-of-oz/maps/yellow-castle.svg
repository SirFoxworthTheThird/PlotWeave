<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="900" viewBox="0 0 1250 900">
  <!-- The Yellow Castle of the West, as a plan. Rooms match the world's markers. -->
  <defs>
    <pattern id="paper" width="150" height="150" patternUnits="userSpaceOnUse">
      <rect width="150" height="150" fill="#ddd0a2"/>
      <g fill="#c3b285" fill-opacity=".55">
        <circle cx="26" cy="40" r="1.6"/><circle cx="100" cy="20" r="1.4"/><circle cx="62" cy="100" r="1.5"/>
        <circle cx="128" cy="116" r="1.3"/><circle cx="12" cy="124" r="1.4"/>
      </g>
    </pattern>
    <pattern id="stone" width="52" height="20" patternUnits="userSpaceOnUse">
      <rect width="52" height="20" fill="#a98b3f"/>
      <path d="M0 0 H52 M0 10 H52 M26 0 V10 M0 10 V20 M52 10 V20" stroke="#6b5318" stroke-width="1.8" fill="none"/>
    </pattern>
    <pattern id="flag" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="#f0e3ae"/>
      <path d="M0 18 H36 M18 0 V36" stroke="#dcc98c" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="64%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#463307" stop-opacity=".24"/>
    </radialGradient>
    <style>
      .t{font-family:Georgia,'Times New Roman',serif;fill:#463307}
      .feat{font-size:21px;paint-order:stroke;stroke:#f4ead0;stroke-width:5;stroke-linejoin:round}
      .note{font-size:16px;font-style:italic;fill:#6b5620}
      .room{fill:url(#flag);stroke:#6b5318;stroke-width:3}
      .swing{fill:none;stroke:#8a6d22;stroke-width:1.8;stroke-dasharray:5 4}
    </style>
  </defs>

  <rect width="1250" height="900" fill="url(#paper)"/>

  <!-- the curtain wall, with corner towers and crenellation -->
  <rect x="58" y="146" width="1134" height="700" fill="url(#flag)" stroke="#6b5318" stroke-width="4"/>
  <path d="M58 146 H1192 V846 H58 Z M92 180 H1158 V812 H92 Z" fill="url(#stone)" fill-rule="evenodd"
        stroke="#4d3a10" stroke-width="2.4"/>
  <g fill="url(#stone)" stroke="#4d3a10" stroke-width="2.6">
    <rect x="58" y="146" width="96" height="96"/><rect x="1096" y="146" width="96" height="96"/>
    <rect x="58" y="750" width="96" height="96"/><rect x="1096" y="750" width="96" height="96"/>
  </g>
  <g fill="#c9a94a" stroke="#4d3a10" stroke-width="2">
    <rect x="58" y="130" width="22" height="18"/><rect x="94" y="130" width="22" height="18"/>
    <rect x="130" y="130" width="22" height="18"/>
    <rect x="1096" y="130" width="22" height="18"/><rect x="1132" y="130" width="22" height="18"/>
    <rect x="1168" y="130" width="22" height="18"/>
  </g>

  <!-- the front doorstep, at 231,535 -->
  <g>
    <rect x="146" y="470" width="170" height="130" class="room"/>
    <path d="M92 535 h54" stroke="#4d3a10" stroke-width="10"/>
    <path d="M146 500 v70" stroke="#8a6d22" stroke-width="4"/>
    <path d="M146 500 a35 35 0 0 1 35 35" class="swing"/>
    <g stroke="#b39a52" stroke-width="2"><path d="M170 470 v130 M200 470 v130 M230 470 v130 M260 470 v130 M290 470 v130"/></g>
  </g>

  <!-- the great kitchen, at 515,535 -->
  <g>
    <rect x="380" y="430" width="270" height="210" class="room"/>
    <!-- hearth -->
    <rect x="400" y="452" width="90" height="58" fill="#8a6d22" stroke="#4d3a10" stroke-width="2.6"/>
    <path d="M414 510 q14 -26 28 0 q14 -26 28 0" fill="#d9843c" stroke="#7d3f14" stroke-width="2.2"/>
    <!-- pots and a swept floor -->
    <circle cx="556" cy="486" r="26" fill="#e6d49a" stroke="#6b5318" stroke-width="2.6"/>
    <path d="M534 474 a26 26 0 0 1 44 0" fill="none" stroke="#6b5318" stroke-width="2.2"/>
    <circle cx="606" cy="516" r="17" fill="#e6d49a" stroke="#6b5318" stroke-width="2.4"/>
    <rect x="416" y="556" width="200" height="60" rx="6" fill="#efe2ad" stroke="#6b5318" stroke-width="2.4"/>
    <g stroke="#c9b169" stroke-width="1.6"><path d="M416 586 H616 M466 556 v60 M516 556 v60 M566 556 v60"/></g>
    <path d="M316 535 h64" stroke="#8a6d22" stroke-width="4"/>
    <path d="M316 535 a32 32 0 0 1 32 -32" class="swing"/>
  </g>

  <!-- the iron-fenced yard, at 515,255 -->
  <g>
    <rect x="380" y="150" width="270" height="210" fill="#d8c47f" stroke="#6b5318" stroke-width="3"/>
    <g stroke="#5c4a1c" stroke-width="5">
      <path d="M392 150 V360 M416 150 V360 M440 150 V360 M464 150 V360 M488 150 V360 M512 150 V360
               M536 150 V360 M560 150 V360 M584 150 V360 M608 150 V360 M632 150 V360"/>
    </g>
    <g stroke="#5c4a1c" stroke-width="4"><path d="M380 190 H650 M380 320 H650"/></g>
    <g stroke="#7a6528" stroke-width="2" opacity=".7"><path d="M398 152 V358 M422 152 V358"/></g>
    <rect x="380" y="150" width="270" height="210" fill="none" stroke="#4d3a10" stroke-width="4"/>
    <path d="M600 430 V360" stroke="#8a6d22" stroke-width="4"/>
  </g>

  <!-- the Winkie workshops, at 876,250 -->
  <g>
    <rect x="726" y="150" width="300" height="200" class="room"/>
    <g fill="#dfcb8a" stroke="#6b5318" stroke-width="2.6">
      <rect x="752" y="186" width="90" height="34" rx="4"/><rect x="880" y="186" width="90" height="34" rx="4"/>
      <rect x="752" y="266" width="90" height="34" rx="4"/><rect x="880" y="266" width="90" height="34" rx="4"/>
    </g>
    <g stroke="#8a6d22" stroke-width="2.2" fill="none">
      <path d="M768 178 l10 -16 M800 178 l10 -16 M896 178 l10 -16 M928 178 l10 -16"/>
      <path d="M770 258 h54 M770 250 l12 -10 M900 258 h54"/>
    </g>
  </g>

  <!-- the Witch's cupboard room, at 876,540 -->
  <g>
    <rect x="726" y="440" width="300" height="200" class="room"/>
    <g transform="translate(876,530)">
      <rect x="-86" y="-50" width="172" height="104" rx="6" fill="#e6d49a" stroke="#6b5318" stroke-width="3"/>
      <path d="M0 -50 V54" stroke="#6b5318" stroke-width="3"/>
      <path d="M-86 -14 H86 M-86 20 H86" stroke="#c9b169" stroke-width="2"/>
      <circle cx="-13" cy="4" r="5" fill="#6b5318"/><circle cx="13" cy="4" r="5" fill="#6b5318"/>
      <!-- the cap on its shelf -->
      <path d="M-52 -30 a14 10 0 0 1 28 0 z" fill="#e0b93f" stroke="#6b5318" stroke-width="2"/>
      <path d="M-56 -20 h36" stroke="#6b5318" stroke-width="2.4"/>
    </g>
    <path d="M650 540 h76" stroke="#8a6d22" stroke-width="4"/>
    <path d="M650 540 a38 38 0 0 1 38 -38" class="swing"/>
  </g>

  <!-- the watching door, at 231,700 -->
  <g transform="translate(231,700)">
    <rect x="-62" y="-58" width="124" height="116" class="room"/>
    <circle cx="0" cy="-8" r="26" fill="#efe2ad" stroke="#6b5318" stroke-width="3"/>
    <circle cx="0" cy="-8" r="11" fill="#c9a94a" stroke="#6b5318" stroke-width="2.4"/>
    <path d="M-40 -8 h14 M26 -8 h14 M0 -48 v14 M0 18 v14" stroke="#6b5318" stroke-width="2.4"/>
    <path d="M-62 30 h124" stroke="#c9b169" stroke-width="2"/>
  </g>

  <g class="t feat">
    <text x="231" y="628" text-anchor="middle">The Front Doorstep</text>
    <text x="515" y="672" text-anchor="middle">The Great Kitchen</text>
    <text x="470" y="398" text-anchor="middle">The Iron-Fenced Yard</text>
    <text x="876" y="388" text-anchor="middle">The Winkie Workshops</text>
    <text x="876" y="676" text-anchor="middle">The Witch’s Cupboard Room</text>
    <text x="231" y="792" text-anchor="middle">The Watching Door</text>
  </g>

  <rect width="1250" height="900" fill="url(#vignette)"/>
  <g transform="translate(44,36)">
    <rect x="0" y="0" width="560" height="92" rx="6" fill="#f6edd2" fill-opacity=".88" stroke="#6b5318" stroke-width="3"/>
    <rect x="8" y="8" width="544" height="76" rx="4" fill="none" stroke="#6b5318" stroke-width="1.3" stroke-opacity=".6"/>
    <text class="t" x="22" y="50" font-size="38" font-weight="bold">The Yellow Castle of the West</text>
    <text class="t note" x="22" y="76">One tower, one wicked Witch, and a country of yellow Winkies about it</text>
  </g>
  <rect x="16" y="16" width="1218" height="868" rx="6" fill="none" stroke="#6b5318" stroke-width="4"/>
</svg>
