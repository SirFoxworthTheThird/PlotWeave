<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1300" viewBox="0 0 1700 1300">
  <defs>
    <pattern id="sand" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#e4cfa0"/>
      <circle cx="6" cy="7" r="1.6" fill="#c9ad78"/><circle cx="19" cy="15" r="1.4" fill="#c9ad78"/>
      <circle cx="12" cy="21" r="1.2" fill="#cdb384"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#8fd3a6"/><stop offset="100%" stop-color="#4e9a6f"/>
    </radialGradient>
    <style>
      .t{font-family:Georgia,'Times New Roman',serif;fill:#3a2f22}
      .title{font-size:48px;font-weight:bold;letter-spacing:2px}
      .region{font-size:33px;font-weight:bold;letter-spacing:3px;opacity:.7}
      .sub{font-size:18px;font-style:italic;opacity:.7}
      .feat{font-size:21px}
      .note{font-size:17px;font-style:italic;fill:#5c4c38}
      .road{fill:none;stroke:#d9b23c;stroke-width:16;stroke-linecap:round}
      .roadline{fill:none;stroke:#a2801f;stroke-width:16;stroke-linecap:round;stroke-dasharray:2 17}
      .track{fill:none;stroke:#7d6a4f;stroke-width:6;stroke-linecap:round;stroke-dasharray:15 13}
      .water{fill:none;stroke:#7fa9be;stroke-width:14;stroke-linecap:round}
    </style>
  </defs>

  <rect width="1700" height="1300" fill="url(#sand)"/>
  <clipPath id="land"><ellipse cx="850" cy="650" rx="690" ry="545"/></clipPath>

  <g clip-path="url(#land)">
    <rect width="1700" height="1300" fill="#dfe6cf"/>
    <polygon points="0,0 1700,0 850,650" fill="#c6bad2"/>
    <polygon points="0,1300 1700,1300 850,650" fill="#e0aaa3"/>
    <polygon points="1700,0 1700,1300 850,650" fill="#a2c0da"/>
    <polygon points="0,0 0,1300 850,650" fill="#e7d189"/>
    <g stroke="#cabfa8" stroke-width="3" opacity=".55">
      <line x1="850" y1="650" x2="1700" y2="0"/><line x1="850" y1="650" x2="1700" y2="1300"/>
      <line x1="850" y1="650" x2="0" y2="1300"/><line x1="850" y1="650" x2="0" y2="0"/>
    </g>

    <!-- the river: out of the northern country, south past the poppy meadows -->
    <path class="water" d="M1044 512 C1020 604 1006 664 998 706 C986 774 972 838 958 906"/>

    <!-- forest between the Munchkin farms and the river -->
    <g fill="#6f8d63" opacity=".9">
      <circle cx="1136" cy="754" r="30"/><circle cx="1179" cy="732" r="26"/><circle cx="1100" cy="732" r="24"/>
      <circle cx="1162" cy="782" r="24"/><circle cx="1110" cy="786" r="22"/><circle cx="1208" cy="762" r="20"/>
      <circle cx="1074" cy="762" r="19"/>
    </g>
    <!-- poppy field, west of the river and south of the road -->
    <g fill="#c8453f" opacity=".9">
      <circle cx="1004" cy="812" r="9"/><circle cx="1028" cy="826" r="8"/><circle cx="982" cy="828" r="8"/>
      <circle cx="1016" cy="844" r="8"/><circle cx="1046" cy="806" r="7"/><circle cx="976" cy="802" r="7"/>
      <circle cx="994" cy="858" r="7"/><circle cx="1036" cy="858" r="6"/><circle cx="964" cy="850" r="6"/>
    </g>
    <!-- wood of the fighting trees, on the road south out of the city -->
    <g fill="#6b7f5c" opacity=".85">
      <circle cx="820" cy="812" r="24"/><circle cx="854" cy="800" r="20"/><circle cx="790" cy="800" r="19"/>
    </g>
    <!-- the dainty china country, behind its low white walls -->
    <g>
      <rect x="800" y="890" width="116" height="76" rx="8" fill="#f6f2ea" stroke="#b9aa93" stroke-width="5"/>
      <g fill="#cf8f8f"><rect x="818" y="920" width="18" height="26"/><rect x="850" y="912" width="18" height="34"/>
        <rect x="882" y="922" width="16" height="24"/></g>
    </g>
    <!-- the marshes below the china country -->
    <g fill="#8fa07a" opacity=".7">
      <ellipse cx="960" cy="1002" rx="46" ry="20"/><ellipse cx="1006" cy="1018" rx="28" ry="13"/>
    </g>
    <!-- the great forest where the Lion is made king of beasts -->
    <g fill="#5f7d57" opacity=".9">
      <circle cx="838" cy="1058" r="31"/><circle cx="882" cy="1042" r="26"/><circle cx="800" cy="1042" r="25"/>
      <circle cx="860" cy="1086" r="24"/><circle cx="812" cy="1084" r="22"/><circle cx="906" cy="1074" r="20"/>
      <circle cx="770" cy="1074" r="19"/>
    </g>
    <!-- hill of the Hammer-Heads -->
    <g fill="#a99274" opacity=".95">
      <path d="M600 1104 l40 -46 40 46 z"/><path d="M652 1108 l46 -54 46 54 z"/><path d="M710 1102 l36 -42 36 42 z"/>
    </g>

    <!-- the road of yellow brick: Munchkin country to the Emerald City -->
    <path class="road" d="M1452 700 C1372 744 1304 708 1242 708 C1166 708 1126 770 1062 746 C1010 726 950 692 916 668"/>
    <path class="roadline" d="M1452 700 C1372 744 1304 708 1242 708 C1166 708 1126 770 1062 746 C1010 726 950 692 916 668"/>
    <!-- no road at all, west to the Winkie country -->
    <path class="track" d="M786 640 C676 618 552 606 440 600"/>
    <!-- the way south to Glinda's castle -->
    <path class="track" d="M840 714 C828 766 824 826 848 878 C874 934 946 962 946 1006 C946 1050 880 1080 800 1092 C740 1100 700 1094 682 1090 C716 1116 780 1128 856 1122"/>
  </g>

  <ellipse cx="850" cy="650" rx="690" ry="545" fill="none" stroke="#8a7448" stroke-width="7"/>

  <!-- the Emerald City stands at the exact centre of the country -->
  <circle cx="850" cy="650" r="60" fill="url(#glow)" stroke="#2f6b48" stroke-width="6"/>
  <g fill="#2c6444">
    <rect x="829" y="624" width="12" height="38"/><rect x="845" y="614" width="14" height="48"/>
    <rect x="863" y="628" width="11" height="34"/>
  </g>
  <!-- the Wicked Witch's yellow castle, away west where the sun sets -->
  <g transform="translate(400,600)">
    <rect x="-42" y="-30" width="84" height="58" fill="#e0b93f" stroke="#7d6320" stroke-width="5"/>
    <rect x="-46" y="-46" width="20" height="20" fill="#e0b93f" stroke="#7d6320" stroke-width="5"/>
    <rect x="26" y="-46" width="20" height="20" fill="#e0b93f" stroke="#7d6320" stroke-width="5"/>
    <rect x="-10" y="-2" width="20" height="30" fill="#7d6320"/>
  </g>
  <!-- Glinda's castle, on the edge of the southern desert -->
  <g transform="translate(880,1122)">
    <rect x="-40" y="-28" width="80" height="54" fill="#d4595f" stroke="#79262d" stroke-width="5"/>
    <rect x="-44" y="-44" width="19" height="20" fill="#d4595f" stroke="#79262d" stroke-width="5"/>
    <rect x="25" y="-44" width="19" height="20" fill="#d4595f" stroke="#79262d" stroke-width="5"/>
    <rect x="-9" y="0" width="18" height="26" fill="#79262d"/>
  </g>
  <!-- where the cyclone set the farmhouse down -->
  <g transform="translate(1460,700)">
    <path d="M-30 6 L0 -22 L30 6 Z" fill="#9c7a55" stroke="#5e4630" stroke-width="4"/>
    <rect x="-22" y="6" width="44" height="28" fill="#c9b291" stroke="#5e4630" stroke-width="4"/>
  </g>

  <text class="t region" x="1290" y="450" text-anchor="middle">THE EAST</text>
  <text class="t sub" x="1290" y="480" text-anchor="middle">Country of the Munchkins — blue</text>
  <text class="t region" x="392" y="428" text-anchor="middle">THE WEST</text>
  <text class="t sub" x="392" y="458" text-anchor="middle">Country of the Winkies — yellow</text>
  <text class="t region" x="1180" y="980" text-anchor="middle">THE SOUTH</text>
  <text class="t sub" x="1180" y="1010" text-anchor="middle">Country of the Quadlings — red</text>
  <text class="t region" x="850" y="222" text-anchor="middle">THE NORTH</text>
  <text class="t sub" x="850" y="252" text-anchor="middle">Home of the Good Witch of the North</text>

  <text class="t feat" x="850" y="744" text-anchor="middle" fill="#22503a">The Emerald City</text>
  <text class="t feat" x="1146" y="834" text-anchor="middle">Forest</text>
  <text class="t feat" x="1070" y="880" text-anchor="start">Poppy Field</text>
  <text class="t feat" x="1062" y="524" text-anchor="start">River</text>
  <text class="t feat" x="738" y="806" text-anchor="end">Fighting Trees</text>
  <text class="t feat" x="782" y="1004" text-anchor="end">China Country</text>
  <text class="t feat" x="1044" y="1054" text-anchor="start">Marshes</text>
  <text class="t feat" x="946" y="1120" text-anchor="start">Great Forest</text>
  <text class="t feat" x="572" y="1058" text-anchor="end">Hill of the</text>
  <text class="t feat" x="572" y="1082" text-anchor="end">Hammer-Heads</text>
  <text class="t feat" x="880" y="1180" text-anchor="middle">Glinda’s Castle</text>
  <text class="t feat" x="400" y="676" text-anchor="middle">The Yellow Castle</text>
  <text class="t feat" x="1452" y="768" text-anchor="middle">Where the house fell</text>
  <text class="t feat" x="1332" y="666" text-anchor="middle">Road of Yellow Brick</text>
  <text class="t feat" x="596" y="566" text-anchor="middle">no road — open country</text>

  <text class="t feat" x="150" y="188">The Deadly Desert</text>
  <text class="t note" x="150" y="216">impassable on every side</text>
  <text class="t feat" x="1400" y="1188" text-anchor="middle">The Deadly Desert</text>

  <g transform="translate(1512,206)">
    <circle r="54" fill="#f3e8cd" stroke="#8a7448" stroke-width="4"/>
    <path d="M0 -44 L11 0 L0 44 L-11 0 Z" fill="#7a3f32"/>
    <path d="M-44 0 L0 -11 L44 0 L0 11 Z" fill="#5c4c38" opacity=".55"/>
    <text class="t" x="0" y="-60" text-anchor="middle" font-size="20" font-weight="bold">N</text>
    <text class="t" x="0" y="76" text-anchor="middle" font-size="20" font-weight="bold">S</text>
    <text class="t" x="72" y="7" text-anchor="middle" font-size="20" font-weight="bold">E</text>
    <text class="t" x="-72" y="7" text-anchor="middle" font-size="20" font-weight="bold">W</text>
  </g>

  <text class="t title" x="70" y="88">The Land of Oz</text>
  <text class="t note" x="70" y="118">An interpretive narrative map drawn from the 1900 text · not to geographic scale</text>
</svg>
