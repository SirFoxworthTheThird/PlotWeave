<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <defs>
    <radialGradient id="citylight" cx="50%" cy="45%">
      <stop offset="0%" stop-color="#d8f0dd"/><stop offset="100%" stop-color="#a8d3b4"/>
    </radialGradient>
    <pattern id="cobble" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="34" height="34" fill="#bfe0c6"/>
      <path d="M0 17 H34 M17 0 V34" stroke="#a9cfb2" stroke-width="2"/>
      <circle cx="17" cy="17" r="2.4" fill="#7fb894"/>
    </pattern>
    <style>
      .t{font-family:Georgia,'Times New Roman',serif;fill:#1f4633}
      .title{font-size:42px;font-weight:bold}
      .feat{font-size:21px}
      .note{font-size:17px;font-style:italic;fill:#3d6650}
      .street{fill:none;stroke:#8fc3a1;stroke-width:26;stroke-linecap:round}
      .road{fill:none;stroke:#d9b23c;stroke-width:16;stroke-linecap:round}
      .roadline{fill:none;stroke:#a2801f;stroke-width:16;stroke-linecap:round;stroke-dasharray:2 17}
    </style>
  </defs>

  <rect width="1400" height="1000" fill="#cfd8c4"/>
  <circle cx="660" cy="510" r="410" fill="url(#citylight)"/>
  <clipPath id="walls"><circle cx="660" cy="510" r="398"/></clipPath>
  <g clip-path="url(#walls)"><rect width="1400" height="1000" fill="url(#cobble)"/></g>

  <!-- the great green wall, studded all round -->
  <circle cx="660" cy="510" r="398" fill="none" stroke="#2f7a52" stroke-width="26"/>
  <circle cx="660" cy="510" r="398" fill="none" stroke="#1e5c3c" stroke-width="5"/>
  <g fill="#7ce0a8">
    <circle cx="660" cy="112" r="7"/><circle cx="941" cy="229" r="7"/><circle cx="1058" cy="510" r="7"/>
    <circle cx="941" cy="791" r="7"/><circle cx="660" cy="908" r="7"/><circle cx="379" cy="791" r="7"/>
    <circle cx="262" cy="510" r="7"/><circle cx="379" cy="229" r="7"/>
  </g>

  <!-- the road of yellow brick arrives at the gate from the east -->
  <path class="road" d="M1390 510 H1074"/>
  <path class="roadline" d="M1390 510 H1074"/>

  <!-- the gate and the Guardian's little room just inside it -->
  <g transform="translate(1058,510)">
    <rect x="-26" y="-58" width="52" height="116" rx="8" fill="#3f9a68" stroke="#164a2f" stroke-width="6"/>
    <circle cx="0" cy="0" r="13" fill="#d8f5e3" stroke="#164a2f" stroke-width="4"/>
  </g>
  <rect x="932" y="454" width="102" height="112" rx="10" fill="#bde6cb" stroke="#2f7a52" stroke-width="6"/>
  <text class="t feat" x="940" y="608" text-anchor="middle">Guardian’s Room</text>
  <text class="t feat" x="1215" y="464" text-anchor="middle">The Great Gate</text>

  <!-- streets -->
  <path class="street" d="M916 510 H796"/>
  <path class="street" d="M660 300 V416"/>
  <path class="street" d="M660 720 V612"/>
  <path class="street" d="M420 510 H524"/>
  <path class="street" d="M470 320 L568 418"/>
  <path class="street" d="M470 700 L568 602"/>

  <!-- shops along the streets -->
  <g fill="#9ed4b0" stroke="#2f7a52" stroke-width="4">
    <rect x="742" y="352" width="70" height="56" rx="6"/><rect x="742" y="612" width="70" height="56" rx="6"/>
    <rect x="486" y="352" width="70" height="56" rx="6"/><rect x="486" y="612" width="70" height="56" rx="6"/>
    <rect x="352" y="474" width="64" height="72" rx="6"/><rect x="628" y="212" width="64" height="66" rx="6"/>
  </g>
  <text class="t feat" x="396" y="592" text-anchor="middle">Green Streets and Shops</text>

  <!-- the Palace of Oz, exactly in the middle of the City -->
  <g transform="translate(660,510)">
    <rect x="-118" y="-96" width="236" height="192" rx="12" fill="#57ab7c" stroke="#14472d" stroke-width="7"/>
    <path d="M-70 -96 L-70 -150 L-40 -178 L-10 -150 L-10 -96 Z" fill="#48986c" stroke="#14472d" stroke-width="6"/>
    <path d="M14 -96 L14 -164 L48 -196 L82 -164 L82 -96 Z" fill="#48986c" stroke="#14472d" stroke-width="6"/>
    <rect x="-26" y="30" width="52" height="66" fill="#14472d"/>
    <g fill="#bff0d2"><rect x="-90" y="-52" width="30" height="34"/><rect x="-30" y="-52" width="30" height="34"/>
      <rect x="30" y="-52" width="30" height="34"/><rect x="70" y="-52" width="26" height="34"/></g>
  </g>
  <text class="t feat" x="660" y="666" text-anchor="middle">The Palace of Oz</text>
  <text class="t note" x="660" y="692" text-anchor="middle">the throne room lies within</text>

  <!-- the ground in front of the palace, where the balloon was filled -->
  <ellipse cx="660" cy="790" rx="132" ry="52" fill="#d5eddd" stroke="#2f7a52" stroke-width="5"/>
  <g transform="translate(660,772)">
    <path d="M-38 6 C-38 -34 38 -34 38 6 C38 26 16 42 0 46 C-16 42 -38 26 -38 6 Z"
          fill="#a9dcbc" stroke="#2f7a52" stroke-width="5"/>
    <path d="M-14 46 h28 v16 h-28 z" fill="#8a6b3f" stroke="#43331c" stroke-width="4"/>
  </g>
  <text class="t feat" x="660" y="862" text-anchor="middle">The Launching Ground</text>

  <text class="t title" x="60" y="80">The Emerald City</text>
  <text class="t note" x="60" y="112">Every visitor is locked into green spectacles at the gate</text>
</svg>
