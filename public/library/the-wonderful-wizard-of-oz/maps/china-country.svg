<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="850" viewBox="0 0 1250 850">
  <defs>
    <linearGradient id="platter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eef0f2"/>
    </linearGradient>
    <style>
      .t{font-family:Georgia,'Times New Roman',serif;fill:#4a3f4a}
      .title{font-size:40px;font-weight:bold}
      .feat{font-size:21px}
      .note{font-size:17px;font-style:italic;fill:#6d6070}
      .wall{fill:#f4f1ec;stroke:#b6a9a0;stroke-width:9}
      .track{fill:none;stroke:#c2b4bd;stroke-width:6;stroke-linecap:round;stroke-dasharray:14 12}
    </style>
  </defs>

  <rect width="1250" height="850" fill="#ded6d0"/>
  <rect x="70" y="150" width="1110" height="620" rx="14" fill="url(#platter)" stroke="#c9bcb4" stroke-width="5"/>

  <!-- the two china walls: one climbed into, one climbed out of -->
  <rect x="70" y="150" width="1110" height="40" class="wall"/>
  <rect x="70" y="730" width="1110" height="40" class="wall"/>
  <text class="t feat" x="625" y="140" text-anchor="middle">The High China Wall</text>
  <text class="t note" x="1000" y="118" text-anchor="middle">climbed by the Woodman’s ladder</text>
  <text class="t feat" x="625" y="806" text-anchor="middle">The Low China Wall</text>

  <path class="track" d="M330 190 C360 300 470 330 560 380 C680 448 760 520 800 620 C830 690 840 716 846 730"/>

  <!-- the milkmaid, her cow, and the spilt pail -->
  <g transform="translate(330,330)">
    <ellipse cx="0" cy="66" rx="120" ry="26" fill="#f2eef0"/>
    <g fill="#f7f3f4" stroke="#a9a0a6" stroke-width="4">
      <ellipse cx="-24" cy="6" rx="54" ry="34"/><circle cx="34" cy="-10" r="24"/>
      <path d="M-62 30 v34 M-30 34 v30 M6 34 v30 M32 30 v34"/>
    </g>
    <g fill="#e2b7c2" stroke="#a9a0a6" stroke-width="4"><circle cx="-96" cy="4" r="20"/>
      <rect x="-112" y="24" width="32" height="42" rx="8"/></g>
    <g fill="#dbd3d8" stroke="#a9a0a6" stroke-width="3"><path d="M-140 60 l22 -20 l14 16 z"/></g>
  </g>
  <text class="t feat" x="330" y="446" text-anchor="middle">The Milkmaid’s Farm</text>

  <!-- the Princess who will not be chased -->
  <g transform="translate(700,346)">
    <circle cx="0" cy="-30" r="22" fill="#f8f4f5" stroke="#a9a0a6" stroke-width="4"/>
    <path d="M-34 44 C-34 -4 34 -4 34 44 Z" fill="#d9c7e4" stroke="#a9a0a6" stroke-width="4"/>
    <path d="M-14 -48 l6 -14 l8 12 l8 -12 l6 14 z" fill="#e8d79a" stroke="#a9a0a6" stroke-width="3"/>
  </g>
  <text class="t feat" x="700" y="428" text-anchor="middle">The Princess’s Meadow</text>

  <!-- Mr Joker, mended in a hundred places -->
  <g transform="translate(986,300)">
    <circle cx="0" cy="-26" r="21" fill="#f8f4f5" stroke="#a9a0a6" stroke-width="4"/>
    <path d="M-30 40 C-30 -2 30 -2 30 40 Z" fill="#efc7a8" stroke="#a9a0a6" stroke-width="4"/>
    <path d="M-12 -44 l12 -18 l12 18 z" fill="#cf8f8f" stroke="#a9a0a6" stroke-width="3"/>
    <g stroke="#bfb2b8" stroke-width="2.5"><path d="M-18 10 l14 8 M4 4 l12 12 M-6 26 l16 -6"/></g>
  </g>
  <text class="t feat" x="986" y="386" text-anchor="middle">Mr Joker’s Corner</text>

  <!-- the little church the Lion's tail brings down -->
  <g transform="translate(430,616)">
    <rect x="-58" y="-24" width="116" height="72" fill="#f8f4f5" stroke="#a9a0a6" stroke-width="5"/>
    <path d="M-58 -24 L0 -70 L58 -24 Z" fill="#cfd9e8" stroke="#a9a0a6" stroke-width="5"/>
    <rect x="-14" y="8" width="28" height="40" fill="#c9bcc4"/>
    <path d="M0 -70 v-22 M-9 -84 h18" stroke="#a9a0a6" stroke-width="4"/>
  </g>
  <text class="t feat" x="430" y="700" text-anchor="middle">The China Church</text>

  <!-- barns and stock -->
  <g transform="translate(1040,600)" fill="#f8f4f5" stroke="#a9a0a6" stroke-width="4">
    <rect x="-70" y="-16" width="140" height="60" rx="6"/>
    <path d="M-78 -16 L0 -58 L78 -16 Z" fill="#e7dfe2"/>
  </g>
  <text class="t feat" x="1040" y="692" text-anchor="middle">China Barns</text>

  <text class="t title" x="60" y="80">The Dainty China Country</text>
  <text class="t note" x="60" y="112">A floor smooth as a platter, and nothing on it taller than Dorothy’s knee</text>
</svg>
