<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900">
  <defs>
    <pattern id="marble" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#cfe8d6"/>
      <path d="M0 20 H40 M20 0 V40" stroke="#bcdcc6" stroke-width="2"/>
    </pattern>
    <radialGradient id="dome" cx="50%" cy="45%">
      <stop offset="0%" stop-color="#eafaf0"/><stop offset="100%" stop-color="#9fd4b3"/>
    </radialGradient>
    <style>
      .t{font-family:Georgia,'Times New Roman',serif;fill:#1f4633}
      .title{font-size:40px;font-weight:bold}
      .feat{font-size:21px}
      .note{font-size:17px;font-style:italic;fill:#3d6650}
      .room{fill:#d9efe0;stroke:#2f7a52;stroke-width:6}
      .hall{fill:#c6e5d1;stroke:#2f7a52;stroke-width:6}
      .door{stroke:#14472d;stroke-width:9;stroke-linecap:round}
    </style>
  </defs>

  <rect width="1300" height="900" fill="#b9cdbe"/>
  <rect x="70" y="150" width="1160" height="690" rx="18" fill="url(#marble)" stroke="#14472d" stroke-width="9"/>

  <!-- the corridor the green girl leads her guests along -->
  <rect x="150" y="250" width="470" height="96" rx="10" class="hall"/>
  <text class="t feat" x="385" y="306" text-anchor="middle">Corridor of Guest Rooms</text>

  <!-- the sweetest little room in the world -->
  <rect x="170" y="384" width="220" height="140" rx="10" class="room"/>
  <g transform="translate(280,450)">
    <rect x="-62" y="-30" width="124" height="46" rx="8" fill="#bfe6cd" stroke="#2f7a52" stroke-width="4"/>
    <circle cx="0" cy="34" r="16" fill="#bfe6cd" stroke="#2f7a52" stroke-width="4"/>
  </g>
  <text class="t feat" x="280" y="556" text-anchor="middle">Dorothy’s Green Room</text>
  <path class="door" d="M280 346 V384"/>

  <!-- the way in, past the soldier with the green whiskers -->
  <rect x="150" y="600" width="200" height="150" rx="10" class="hall"/>
  <text class="t feat" x="250" y="666" text-anchor="middle">Palace</text>
  <text class="t feat" x="250" y="692" text-anchor="middle">Gates</text>
  <path class="door" d="M70 675 H150"/>

  <!-- where the court waits every morning without ever being admitted -->
  <rect x="400" y="600" width="250" height="150" rx="10" class="room"/>
  <text class="t feat" x="525" y="666" text-anchor="middle">The Waiting</text>
  <text class="t feat" x="525" y="692" text-anchor="middle">Hall</text>
  <path class="door" d="M350 675 H400"/>
  <path class="door" d="M590 346 V600"/>

  <!-- the great domed throne room -->
  <circle cx="800" cy="470" r="176" fill="url(#dome)" stroke="#14472d" stroke-width="9"/>
  <circle cx="800" cy="470" r="140" fill="none" stroke="#7cc19b" stroke-width="4"/>
  <g transform="translate(800,470)">
    <rect x="-42" y="-30" width="84" height="76" rx="10" fill="#8fcfa9" stroke="#14472d" stroke-width="6"/>
    <rect x="-42" y="-72" width="84" height="46" rx="8" fill="#a9dcbc" stroke="#14472d" stroke-width="6"/>
  </g>
  <text class="t feat" x="800" y="262" text-anchor="middle">The Throne Room</text>
  <path class="door" d="M650 636 L690 598"/>

  <!-- the small chamber behind it, where the properties are kept -->
  <rect x="1010" y="330" width="190" height="160" rx="10" class="room"/>
  <g transform="translate(1105,404)">
    <circle cx="-38" cy="-4" r="24" fill="#bfe6cd" stroke="#2f7a52" stroke-width="4"/>
    <rect x="-4" y="-28" width="44" height="52" rx="6" fill="#bfe6cd" stroke="#2f7a52" stroke-width="4"/>
  </g>
  <text class="t feat" x="1105" y="526" text-anchor="middle">The Little Back Chamber</text>
  <path class="door" d="M976 410 H1010"/>

  <text class="t title" x="60" y="80">The Palace of Oz</text>
  <text class="t note" x="60" y="112">Seven passages and three flights of stairs, flattened onto one plan</text>
</svg>
