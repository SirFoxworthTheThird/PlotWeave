<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="800" viewBox="0 0 1150 800">
  <!-- Glinda's Castle, as a plan. Room positions match the world's markers. -->
  <defs>
    <pattern id="paper" width="150" height="150" patternUnits="userSpaceOnUse">
      <rect width="150" height="150" fill="#e3cdc9"/>
      <g fill="#cdb0ad" fill-opacity=".5">
        <circle cx="26" cy="40" r="1.5"/><circle cx="100" cy="20" r="1.3"/><circle cx="62" cy="102" r="1.4"/>
        <circle cx="128" cy="118" r="1.2"/><circle cx="14" cy="126" r="1.3"/>
      </g>
    </pattern>
    <pattern id="poche" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#a8474f"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#6e2229" stroke-width="3"/>
    </pattern>
    <pattern id="tile" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="#f7e8e6"/>
      <path d="M0 18 H36 M18 0 V36" stroke="#e6c8c6" stroke-width="1.5"/>
      <circle cx="18" cy="18" r="2" fill="#d9a7a5"/>
    </pattern>
    <radialGradient id="ruby" cx="50%" cy="42%" r="66%">
      <stop offset="0%" stop-color="#f6d2d5"/><stop offset="100%" stop-color="#cf7a83"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="64%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5a2229" stop-opacity=".22"/>
    </radialGradient>
    <style>
      .t{font-family:Georgia,'Times New Roman',serif;fill:#5a2a30}
      .feat{font-size:21px;paint-order:stroke;stroke:#fbeeed;stroke-width:5;stroke-linejoin:round}
      .note{font-size:16px;font-style:italic;fill:#7d4046}
      .room{fill:url(#tile);stroke:#79262d;stroke-width:3}
      .swing{fill:none;stroke:#a8474f;stroke-width:1.8;stroke-dasharray:5 4}
    </style>
  </defs>

  <rect width="1150" height="800" fill="url(#paper)"/>

  <!-- the outer wall, poché, with corner towers -->
  <path d="M62 138 H1088 V754 H62 Z M92 168 H1058 V724 H92 Z" fill="url(#poche)" fill-rule="evenodd"
        stroke="#5c1a20" stroke-width="2.6"/>
  <rect x="92" y="168" width="966" height="556" fill="url(#tile)"/>
  <g fill="url(#poche)" stroke="#5c1a20" stroke-width="2.6">
    <rect x="62" y="138" width="88" height="88"/><rect x="1000" y="138" width="88" height="88"/>
    <rect x="62" y="666" width="88" height="88"/><rect x="1000" y="666" width="88" height="88"/>
  </g>

  <!-- the road up from the Quadling farms -->
  <path d="M16 440 H92" stroke="#b98088" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 12"/>

  <!-- the castle gates and the three girl soldiers, at 210,440 -->
  <g transform="translate(210,440)">
    <rect x="-36" y="-78" width="72" height="156" rx="8" class="room"/>
    <path d="M-36 0 h72" stroke="#e0b6b4" stroke-width="2"/>
    <g fill="#d4595f" stroke="#79262d" stroke-width="2.4">
      <circle cx="0" cy="-46" r="13"/><circle cx="0" cy="0" r="13"/><circle cx="0" cy="46" r="13"/>
    </g>
    <g stroke="#79262d" stroke-width="2.4" fill="none">
      <path d="M0 -33 v14 M0 13 v14 M0 59 v14"/>
    </g>
    <path d="M-92 0 h56" stroke="#79262d" stroke-width="8"/>
    <path d="M36 -40 v80" stroke="#a8474f" stroke-width="4"/>
    <path d="M36 -40 a40 40 0 0 1 40 40" class="swing"/>
  </g>

  <!-- the outer court, at 415,440 -->
  <g>
    <rect x="300" y="330" width="230" height="220" class="room"/>
    <circle cx="415" cy="440" r="64" fill="#f2dcda" stroke="#c98d92" stroke-width="2.4"/>
    <circle cx="415" cy="440" r="30" fill="#e8c4c2" stroke="#c98d92" stroke-width="2"/>
    <g stroke="#dcb2b0" stroke-width="1.8"><path d="M415 376 v128 M351 440 h128"/></g>
    <path d="M246 440 h54" stroke="#a8474f" stroke-width="4"/>
  </g>

  <!-- the tiring room, at 415,240 -->
  <g>
    <rect x="300" y="180" width="230" height="120" class="room"/>
    <g transform="translate(415,236)">
      <rect x="-58" y="-28" width="116" height="20" rx="7" fill="#f0cfcd" stroke="#a8474f" stroke-width="2.6"/>
      <circle cx="-32" cy="14" r="16" fill="#f0cfcd" stroke="#a8474f" stroke-width="2.6"/>
      <path d="M-32 2 v24 M-44 14 h24" stroke="#a8474f" stroke-width="1.8"/>
      <rect x="4" y="0" width="52" height="28" rx="6" fill="#f0cfcd" stroke="#a8474f" stroke-width="2.6"/>
      <path d="M4 14 h52" stroke="#a8474f" stroke-width="1.8"/>
    </g>
    <path d="M415 330 v-30" stroke="#a8474f" stroke-width="4"/>
    <path d="M415 300 a30 30 0 0 1 -30 30" class="swing"/>
  </g>

  <!-- the ruby throne room, at 800,400 -->
  <g>
    <rect x="600" y="220" width="400" height="380" rx="12" fill="url(#ruby)" stroke="#5c1a20" stroke-width="5"/>
    <g stroke="#e8b0b4" stroke-width="1.8" opacity=".7">
      <path d="M600 300 H1000 M600 400 H1000 M600 500 H1000 M700 220 V600 M800 220 V600 M900 220 V600"/>
    </g>
    <!-- the dais and the throne cut from rubies -->
    <g transform="translate(800,400)">
      <rect x="-118" y="-58" width="236" height="150" rx="10" fill="#dd8f96" stroke="#79262d" stroke-width="3"/>
      <rect x="-92" y="-38" width="184" height="112" rx="8" fill="#e9a9ae" stroke="#79262d" stroke-width="2.4"/>
      <rect x="-72" y="-52" width="144" height="112" rx="12" fill="#c8555f" stroke="#5c1a20" stroke-width="3.4"/>
      <rect x="-72" y="-108" width="144" height="66" rx="10" fill="#d4757e" stroke="#5c1a20" stroke-width="3.4"/>
      <g fill="#fbe7e8" stroke="#79262d" stroke-width="1.6">
        <circle cx="-38" cy="-76" r="9"/><circle cx="0" cy="-84" r="10"/><circle cx="38" cy="-76" r="9"/>
      </g>
      <path d="M-72 60 h144" stroke="#5c1a20" stroke-width="2.6"/>
    </g>
    <path d="M530 440 h70" stroke="#a8474f" stroke-width="4"/>
    <path d="M530 440 a35 35 0 0 1 35 -35" class="swing"/>
  </g>

  <g class="t feat">
    <text x="210" y="574" text-anchor="middle">The Castle Gates</text>
    <text x="459" y="596" text-anchor="middle">The Outer Court</text>
    <text x="415" y="292" text-anchor="middle">The Tiring Room</text>
    <text x="800" y="654" text-anchor="middle">The Ruby Throne Room</text>
  </g>
  <text class="t note" x="210" y="600" text-anchor="middle">three girl soldiers in red and gold</text>
  <text class="t note" x="210" y="624" text-anchor="middle">the road comes up from the Quadling farms</text>

  <rect width="1150" height="800" fill="url(#vignette)"/>
  <g transform="translate(42,30)">
    <rect x="0" y="0" width="470" height="88" rx="6" fill="#fbeeed" fill-opacity=".9" stroke="#79262d" stroke-width="3"/>
    <rect x="8" y="8" width="454" height="72" rx="4" fill="none" stroke="#79262d" stroke-width="1.3" stroke-opacity=".6"/>
    <text class="t" x="22" y="48" font-size="38" font-weight="bold">Glinda’s Castle</text>
    <text class="t note" x="22" y="72">On the southern edge of the country, where the desert begins</text>
  </g>
  <rect x="16" y="16" width="1118" height="768" rx="6" fill="none" stroke="#79262d" stroke-width="4"/>
</svg>
